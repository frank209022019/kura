# Builds Kura's signed installer.
# - A version tag (v1.2.3) publishes it as a GitHub release; installed copies update from there.
# - Starting it by hand is a dry run: the installer is kept as a workflow artifact instead.
# See docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  installer:
    name: Installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
          cache: true
          cache_dependency_path: app/pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri

      - name: Check the version
        run: |
          app=$(node -p "require('./app/package.json').version")
          engine=$(grep -m1 '^version = ' engine/pyproject.toml | cut -d '"' -f2)
          if [ "$app" != "$engine" ]; then
            echo "::error::app/package.json says $app but engine/pyproject.toml says $engine."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$app" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but the version is $app."
            exit 1
          fi
          echo "VERSION=$app" >> "$GITHUB_ENV"

      - run: uv sync --locked --directory engine
      - run: pnpm install --frozen-lockfile --dir app

      - name: Build the installer
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm build:installer

      - name: Check the bundled engine starts and answers
        working-directory: engine
        env:
          KURA_ENGINE_EXE: dist/kura-engine/kura-engine.exe
        run: uv run pytest tests/test_cli.py -k announces

      - name: Keep the installer (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kura-${{ env.VERSION }}-installer
          path: app/src-tauri/target/release/bundle/nsis/

      # The release starts as a draft, so installed copies only see it once
      # latest.json (the update manifest) is in place.
      - name: Publish the release
        if: github.ref_type == 'tag'
        run: |
          tag="v$VERSION"
          name="Kura_${VERSION}_x64-setup.exe"
          installer="app/src-tauri/target/release/bundle/nsis/$name"

          gh release create "$tag" "$installer" "$installer.sig" \
            --draft --title "Kura $VERSION" --generate-notes
          url=$(gh release view "$tag" --json assets \
            --jq ".assets[] | select(.name == \"$name\") | .apiUrl")
          jq -n \
            --arg version "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$installer.sig")" \
            --arg url "$url" \
            '{version: $version, pub_date: $date,
              platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' > latest.json
          gh release upload "$tag" latest.json
          gh release edit "$tag" --draft=false --latest
