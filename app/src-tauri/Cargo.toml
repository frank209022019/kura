[package]
name = "kura"
version = "0.0.0" # Kura's version lives in app/package.json (see docs/releasing.md)
description = "Kura's desktop shell: the window, the engine process and updates."
edition = "2024"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.2", features = [] }
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-updater = "2.13.2"

[profile.release]
codegen-units = 1
lto = true
strip = true
